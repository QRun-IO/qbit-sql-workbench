components:
  schemas:
    BasicErrorResponseV1:
      description: "The error body of every UI API operation (core and extensions)."
      properties:
        error:
          description: "The error message (the same as message; kept for clients of\
            \ UI API 1.0 to 1.5)."
          type: "string"
        code:
          description: "A stable, machine-readable code. Well-known values: BAD_REQUEST\
            \ (400), UNAUTHENTICATED (401),\nPERMISSION_DENIED (403), NOT_FOUND (404),\
            \ CONFLICT (409), RATE_LIMITED (429), INTERNAL_ERROR (500),\nERROR (other).\
            \ Extensions may add codes; treat an unknown code by the HTTP status.\
            \ Since 1.6.0."
          type: "string"
        message:
          description: "A message to show the user. Since 1.6.0."
          type: "string"
        fieldErrors:
          description: "Errors about particular request fields, when known. Since\
            \ 1.6.0."
          items:
            properties:
              field:
                description: "The field (or parameter) name."
                type: "string"
              message:
                description: "The error about that field."
                type: "string"
              code:
                description: "An optional machine-readable code, e.g. REQUIRED, TOO_LONG,\
                  \ PATTERN."
                type: "string"
            type: "object"
          type: "array"
        traceId:
          description: "Identifies this request in the server logs (also the X-QQQ-Trace-Id\
            \ response header); quote it when reporting a problem. Since 1.6.0."
          type: "string"
      type: "object"
    SqlWorkbenchBackendV1:
      properties:
        name:
          type: "string"
        label:
          type: "string"
        vendor:
          nullable: true
          type: "string"
        dialect:
          $ref: "#/components/schemas/SqlWorkbenchDialectV1"
        readOnlyCredentials:
          type: "boolean"
        readOnlyEnforced:
          type: "boolean"
        transactionalDdl:
          type: "boolean"
        writeAllowed:
          type: "boolean"
      type: "object"
    SqlWorkbenchBinaryValueV1:
      properties:
        $binary:
          type: "boolean"
        length:
          format: "int64"
          type: "integer"
        hexPreview:
          type: "string"
      type: "object"
    SqlWorkbenchCancelledV1:
      properties:
        cancelled:
          type: "boolean"
      type: "object"
    SqlWorkbenchCapabilitiesV1:
      properties:
        version:
          type: "string"
        canWrite:
          type: "boolean"
        canShare:
          type: "boolean"
        writeModeEnabled:
          type: "boolean"
        limits:
          $ref: "#/components/schemas/SqlWorkbenchLimitsV1"
        backends:
          items:
            $ref: "#/components/schemas/SqlWorkbenchBackendV1"
          type: "array"
      type: "object"
    SqlWorkbenchCellV1:
      properties:
        cellKey:
          type: "string"
        cellType:
          type: "string"
        title:
          nullable: true
          type: "string"
        content:
          type: "string"
        backendName:
          nullable: true
          type: "string"
        sortOrder:
          format: "int64"
          type: "integer"
      type: "object"
    SqlWorkbenchColumnKindV1:
      enum:
      - "number"
      - "string"
      - "boolean"
      - "date"
      - "datetime"
      - "time"
      - "json"
      - "binary"
      - "array"
      - "other"
